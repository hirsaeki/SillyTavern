name: Sync upstream staging

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Merge upstream staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SillyTavern/SillyTavern.git
          git fetch upstream staging

          if git merge-base --is-ancestor upstream/staging HEAD; then
            echo "Fork staging already contains upstream staging."
            exit 0
          fi

          git merge --no-edit upstream/staging
          git push origin HEAD:staging
